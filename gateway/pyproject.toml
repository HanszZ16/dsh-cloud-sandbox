[project]
name = "dsh-gateway"
version = "0.1.0"
description = "One sandboxed DeepSeek Harness Web instance per signed-in user."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx[socks]>=0.27",
  "websockets>=13",
  "docker>=7.1",
  "cryptography>=43",
  "pyyaml>=6",
]

[project.optional-dependencies]
e2b = ["e2b>=1.0"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dsh_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
