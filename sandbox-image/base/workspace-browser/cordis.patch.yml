# dsh-cloud workspace browser bundle.
#
# The agent operates the workspace's single Chromium through Playwright MCP,
# mounted as an ordinary MCP server so every Session sees the same browser
# tools (mcp__browser__*). It connects over CDP to the browser hub's agent
# proxy inside the sandbox (sandbox-image/base/browser-hub), which starts
# Chromium on first use and lets the user's live view show when the agent is
# operating. Images are omitted from tool results because the default
# DeepSeek models read text; page snapshots still arrive as text.
- insert:
    - id: dsh-cloud-browser-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: browser
        transport: stdio
        command: /usr/local/lib/dsh-cloud/browser-hub/node_modules/.bin/playwright-mcp
        args:
          - --cdp-endpoint
          - http://127.0.0.1:9223
          - --image-responses
          - omit
          - --output-dir
          - /tmp/playwright-mcp
        toolCallTimeoutMs: 120000
    - id: dsh-cloud-workspace-browser
      name: dsh-cloud-workspace-browser
